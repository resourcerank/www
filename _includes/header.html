<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="ResourceRank Home">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="ResourceRank Logo" class="brand-logo" width="36" height="36">
      <div class="brand-text">
        <span class="brand-name">ResourceRank</span>
        <span class="brand-badge">v1.0 SPEC</span>
      </div>
    </a>

    <nav class="site-nav" id="site-nav" aria-label="Primary Navigation">
      <ul class="nav-list">
        {% for item in site.data.navigation %}
          {% assign is_active = false %}
          {% if page.url contains item.url %}
            {% assign is_active = true %}
          {% endif %}
          <li>
            <a href="{{ item.url | relative_url }}" class="nav-link {% if is_active %}active{% endif %}">
              {{ item.title }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>

    <div class="header-actions">
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle color theme" title="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <button id="mobile-menu-toggle" class="icon-btn mobile-only" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
</header>
